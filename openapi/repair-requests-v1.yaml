openapi: 3.0.3
info:
  title: Repair Request API
  version: 1.0.0
  description: |
    Синхронный контракт контекста «Управление заявками».
    Все изменяющие операции идемпотентны в пределах пользователя, operationId и ключа.
    Рекомендуемый клиентский timeout — 3 секунды. При неизвестном исходе клиент
    повторяет запрос с тем же Idempotency-Key и тем же телом.
  contact:
    name: Команда системы управления заявками
servers:
  - url: https://repair-api.example.internal
    description: Placeholder целевой внутренней среды; адрес требует согласования
tags:
  - name: RepairRequests
    description: Lifecycle ремонтной заявки
paths:
  /v1/repair-requests:
    post:
      tags: [RepairRequests]
      summary: Зарегистрировать заявку
      operationId: createRepairRequestV1
      description: |
        Создаёт одну заявку. Повтор с тем же Idempotency-Key и идентичным телом
        возвращает сохранённый результат. Тот же ключ с другим телом возвращает 409.
      x-idempotent: true
      x-timeout-ms: 3000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepairRequest'
            examples:
              hydraulicPress:
                value:
                  equipment_id: EQ-042
                  org_unit_id: OU-PRESS
                  category: hydraulics
                  description: Давление в гидросистеме нестабильно, слышен металлический стук.
                  proposed_priority: high
                  detected_at: '2026-10-29T08:35:00+03:00'
      responses:
        '201':
          description: Заявка зарегистрирована; такой же ответ возвращается при безопасном повторе
          headers:
            Location:
              description: URI созданной заявки
              schema: { type: string, example: /v1/repair-requests/REQ-2026-1043 }
            Idempotent-Replayed:
              description: true, если возвращён ранее сохранённый результат
              schema: { type: boolean, default: false }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairRequest'
              examples:
                created:
                  value:
                    request_id: REQ-2026-1043
                    version: 1
                    equipment_id: EQ-042
                    org_unit_id: OU-PRESS
                    category: hydraulics
                    description: Давление в гидросистеме нестабильно, слышен металлический стук.
                    proposed_priority: high
                    priority: high
                    status: new
                    created_by_employee_id: EMP-0182
                    detected_at: '2026-10-29T08:35:00+03:00'
                    registered_at: '2026-10-29T08:42:00+03:00'
                    updated_at: '2026-10-29T08:42:00+03:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/repair-requests/{requestId}:
    get:
      tags: [RepairRequests]
      summary: Получить карточку заявки
      operationId: getRepairRequestV1
      x-timeout-ms: 2000
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Текущее подтверждённое состояние заявки
          headers:
            ETag:
              description: Версия агрегата для optimistic locking
              schema: { type: string, example: '"7"' }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepairRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/repair-requests/{requestId}/assignment:
    put:
      tags: [RepairRequests]
      summary: Назначить или переназначить исполнителя
      operationId: assignEngineerV1
      description: |
        Запускает оркестрируемую сагу назначения. При быстром подтверждении возвращает 200;
        при незавершённой за бюджет запроса саге — 202 с URI состояния. Повторять можно
        только с тем же Idempotency-Key и телом.
      x-idempotent: true
      x-timeout-ms: 3000
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignEngineer' }
            example:
              engineer_id: EMP-0241
              reason: Назначение по специализации «гидравлика»
      responses:
        '200':
          description: Назначение подтверждено
          headers:
            Idempotent-Replayed:
              schema: { type: boolean, default: false }
              description: true, если возвращён сохранённый результат
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentSaga' }
        '202':
          description: Сага продолжается; результат нужно читать по Location, не создавая новую операцию
          headers:
            Location:
              schema: { type: string, example: /v1/assignment-sagas/8d36a23b-8bd8-46a4-a824-385bbf53c408 }
              description: URI состояния саги
            Retry-After:
              schema: { type: integer, minimum: 1, example: 2 }
              description: Минимальная пауза до проверки состояния, секунды
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentSaga' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/assignment-sagas/{sagaId}:
    get:
      tags: [RepairRequests]
      summary: Получить окончательный или текущий исход саги назначения
      operationId: getAssignmentSagaV1
      x-timeout-ms: 2000
      parameters:
        - $ref: '#/components/parameters/SagaId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Состояние саги; terminal=true означает окончательный исход
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentSaga' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Корпоративный access token; фактический IdP определяется в модуле безопасности
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, pattern: '^REQ-[0-9]{4}-[0-9]{4,}$' }
    SagaId:
      name: sagaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной бизнес-операции; повтор использует тот же ключ и идентичное тело
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID трассировки; при отсутствии создаётся сервером
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag версии заявки, прочитанной диспетчером
      schema: { type: string, pattern: '^"[1-9][0-9]*"$', example: '"3"' }
  headers:
    CorrelationId:
      description: UUID трассировки запроса
      schema: { type: string, format: uuid }
  schemas:
    CreateRepairRequest:
      type: object
      additionalProperties: false
      required: [equipment_id, org_unit_id, category, description, proposed_priority, detected_at]
      properties:
        equipment_id: { type: string, minLength: 1, maxLength: 64, example: EQ-042 }
        org_unit_id: { type: string, minLength: 1, maxLength: 64, example: OU-PRESS }
        category: { $ref: '#/components/schemas/Category' }
        description: { type: string, minLength: 10, maxLength: 2000 }
        proposed_priority: { $ref: '#/components/schemas/Priority' }
        detected_at: { type: string, format: date-time }
    AssignEngineer:
      type: object
      additionalProperties: false
      required: [engineer_id, reason]
      properties:
        engineer_id: { type: string, minLength: 1, maxLength: 64, example: EMP-0241 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    RepairRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - version
        - equipment_id
        - org_unit_id
        - category
        - description
        - proposed_priority
        - priority
        - status
        - created_by_employee_id
        - detected_at
        - registered_at
        - updated_at
      properties:
        request_id: { type: string, pattern: '^REQ-[0-9]{4}-[0-9]{4,}$' }
        version: { type: integer, minimum: 1 }
        equipment_id: { type: string }
        org_unit_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        description: { type: string }
        proposed_priority: { $ref: '#/components/schemas/Priority' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        created_by_employee_id: { type: string }
        assigned_engineer_id: { type: string, nullable: true }
        detected_at: { type: string, format: date-time }
        registered_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssignmentSaga:
      type: object
      additionalProperties: false
      required: [saga_id, request_id, engineer_id, state, terminal, updated_at]
      properties:
        saga_id: { type: string, format: uuid }
        request_id: { type: string }
        engineer_id: { type: string }
        state:
          type: string
          enum: [started, reserving, reserved, confirmed, compensating, compensated, failed_manual_review]
        terminal: { type: boolean }
        failure_code:
          type: string
          nullable: true
          enum: [ENGINEER_UNAVAILABLE, REQUEST_VERSION_CONFLICT, RESERVATION_OUTCOME_UNKNOWN, COMPENSATION_FAILED]
        updated_at: { type: string, format: date-time }
    Category:
      type: string
      enum: [mechanics, electrical, hydraulics, automation, other]
    Priority:
      type: string
      enum: [low, normal, high, critical]
    RequestStatus:
      type: string
      enum: [new, assigned, in_progress, completed, closed]
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, correlation_id]
      properties:
        type: { type: string, format: uri-reference, example: 'urn:repair:error:validation' }
        title: { type: string, example: Ошибка проверки данных }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - IDEMPOTENCY_KEY_REUSED
            - INVALID_STATE_TRANSITION
            - VERSION_CONFLICT
            - VALIDATION_FAILED
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
        detail: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean, default: false }
        invalid_params:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, reason]
            properties:
              name: { type: string }
              reason: { type: string }
  responses:
    BadRequest:
      description: Синтаксически некорректный запрос
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unauthorized:
      description: Требуется аутентификация
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: Недостаточно полномочий; попытка аудируется
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: Ресурс не найден либо не раскрывается текущему пользователю
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Конфликт состояния, назначения или ключа идемпотентности
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    PreconditionFailed:
      description: If-Match не соответствует текущей версии заявки
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    UnprocessableEntity:
      description: Данные понятны синтаксически, но нарушают бизнес-правила
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    TooManyRequests:
      description: Превышен лимит запросов; Retry-After обязателен
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: 'Пауза перед повтором, секунды' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    ServiceUnavailable:
      description: Временная недоступность; повторять только идемпотентную операцию тем же ключом
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: 'Пауза перед повтором, секунды' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
security:
  - bearerAuth: []
