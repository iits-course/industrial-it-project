<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>C2 Container — РемКонтур v0.1</title>
  <defs>
    <marker id="c2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="700" fill="#1f2933">C2 · Container — РемКонтур v0.1</text>
  <text x="24" y="48" font-size="12" fill="#5f6b7a">Контейнер, ответственность и технология. Офлайн NFR-02 реализован на стороне АРМ.</text>

  <rect x="24" y="70" width="200" height="72" rx="8" fill="#084c61"/>
  <text x="124" y="98" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Оператор</text>
  <text x="124" y="118" font-size="11" fill="#d7eef3" text-anchor="middle">Person</text>

  <rect x="248" y="70" width="200" height="72" rx="8" fill="#084c61"/>
  <text x="348" y="98" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Диспетчер</text>
  <text x="348" y="118" font-size="11" fill="#d7eef3" text-anchor="middle">Person</text>

  <rect x="472" y="70" width="200" height="72" rx="8" fill="#084c61"/>
  <text x="572" y="98" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Инженер</text>
  <text x="572" y="118" font-size="11" fill="#d7eef3" text-anchor="middle">Person</text>

  <rect x="40" y="190" width="900" height="520" rx="14" fill="#f7fbfc" stroke="#177e89" stroke-width="2.5"/>
  <text x="60" y="220" font-size="13" font-weight="700" fill="#177e89">Граница системы — РемКонтур</text>

  <rect x="70" y="250" width="280" height="130" rx="10" fill="#ffffff" stroke="#db3a34" stroke-width="2.5"/>
  <text x="210" y="278" font-size="11" fill="#9b2c2c" text-anchor="middle">CONTAINER</text>
  <text x="210" y="302" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">АРМ сотрудника</text>
  <text x="210" y="324" font-size="12" fill="#374151" text-anchor="middle">Список, создание, карточка</text>
  <text x="210" y="344" font-size="12" fill="#374151" text-anchor="middle">Локальная очередь операций создания</text>
  <text x="210" y="364" font-size="11" fill="#6b7280" text-anchor="middle">[SPA/PWA, JavaScript, IndexedDB]</text>

  <rect x="430" y="250" width="280" height="130" rx="10" fill="#ffffff" stroke="#db3a34" stroke-width="2.5"/>
  <text x="570" y="278" font-size="11" fill="#9b2c2c" text-anchor="middle">CONTAINER</text>
  <text x="570" y="302" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Приложение РемКонтур</text>
  <text x="570" y="324" font-size="12" fill="#374151" text-anchor="middle">Модульный монолит: заявки, диспетчеризация,</text>
  <text x="570" y="344" font-size="12" fill="#374151" text-anchor="middle">доступ, ACL, transactional outbox</text>
  <text x="570" y="364" font-size="11" fill="#6b7280" text-anchor="middle">[Python, FastAPI]</text>

  <rect x="430" y="520" width="280" height="130" rx="10" fill="#ffffff" stroke="#db3a34" stroke-width="2.5"/>
  <text x="570" y="548" font-size="11" fill="#9b2c2c" text-anchor="middle">CONTAINER DATABASE</text>
  <text x="570" y="572" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">БД заявок</text>
  <text x="570" y="594" font-size="12" fill="#374151" text-anchor="middle">Заявки, история, аудит, operation_id, outbox</text>
  <text x="570" y="614" font-size="12" fill="#374151" text-anchor="middle">Единственная система записи</text>
  <text x="570" y="634" font-size="11" fill="#6b7280" text-anchor="middle">[PostgreSQL]</text>

  <rect x="70" y="520" width="280" height="130" rx="10" fill="#ffffff" stroke="#db3a34" stroke-width="2.5"/>
  <text x="210" y="548" font-size="11" fill="#9b2c2c" text-anchor="middle">CONTAINER</text>
  <text x="210" y="572" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Обработчик исходящих</text>
  <text x="210" y="594" font-size="12" fill="#374151" text-anchor="middle">Доставляет уведомления из outbox</text>
  <text x="210" y="614" font-size="12" fill="#374151" text-anchor="middle">Агрегат заявки не изменяет</text>
  <text x="210" y="634" font-size="11" fill="#6b7280" text-anchor="middle">[Python worker]</text>

  <rect x="1060" y="190" width="310" height="80" rx="8" fill="#6b7280"/>
  <text x="1215" y="222" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Корпоративный SSO</text>
  <text x="1215" y="244" font-size="12" fill="#e5e7eb" text-anchor="middle">Внешняя система [OIDC]</text>

  <rect x="1060" y="300" width="310" height="80" rx="8" fill="#6b7280"/>
  <text x="1215" y="332" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Справочник сотрудников</text>
  <text x="1215" y="354" font-size="12" fill="#e5e7eb" text-anchor="middle">Внешняя система</text>

  <rect x="1060" y="410" width="310" height="80" rx="8" fill="#6b7280"/>
  <text x="1215" y="442" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Учёт оборудования</text>
  <text x="1215" y="464" font-size="12" fill="#e5e7eb" text-anchor="middle">Внешняя система</text>

  <rect x="1060" y="560" width="310" height="80" rx="8" fill="#6b7280"/>
  <text x="1215" y="592" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Сервис уведомлений</text>
  <text x="1215" y="614" font-size="12" fill="#e5e7eb" text-anchor="middle">Внешняя система</text>

  <line x1="124" y1="142" x2="180" y2="250" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <line x1="348" y1="142" x2="230" y2="250" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <line x1="572" y1="142" x2="280" y2="250" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <text x="300" y="180" font-size="11" fill="#374151">Работают через АРМ</text>

  <line x1="350" y1="315" x2="430" y2="315" stroke="#374151" stroke-width="1.6" marker-end="url(#c2-arr)"/>
  <text x="360" y="304" font-size="11" fill="#111827">Команды и запросы</text>
  <text x="360" y="336" font-size="10" fill="#6b7280">HTTPS/JSON, синхронно</text>

  <line x1="570" y1="380" x2="570" y2="520" stroke="#374151" stroke-width="1.6" marker-end="url(#c2-arr)"/>
  <text x="584" y="450" font-size="11" fill="#111827">Читает и пишет</text>
  <text x="584" y="466" font-size="10" fill="#6b7280">SQL, синхронно</text>

  <line x1="350" y1="585" x2="430" y2="585" stroke="#374151" stroke-width="1.6" marker-end="url(#c2-arr)"/>
  <text x="352" y="574" font-size="11" fill="#111827">Читает outbox</text>
  <text x="348" y="606" font-size="10" fill="#6b7280">SQL, синхронно</text>

  <line x1="350" y1="650" x2="1060" y2="600" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <text x="760" y="640" font-size="11" fill="#111827">Отправляет уведомление [HTTPS, асинхронно]</text>

  <line x1="710" y1="280" x2="1060" y2="230" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <text x="820" y="248" font-size="10" fill="#111827">Проверяет токен [OIDC/HTTPS]</text>
  <line x1="710" y1="320" x2="1060" y2="340" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <text x="820" y="328" font-size="10" fill="#111827">Читает сотрудников [HTTPS/JSON]</text>
  <line x1="710" y1="360" x2="1060" y2="450" stroke="#374151" stroke-width="1.4" marker-end="url(#c2-arr)"/>
  <text x="780" y="400" font-size="10" fill="#111827">Читает оборудование [HTTPS/JSON]</text>

  <rect x="24" y="740" width="1352" height="136" rx="8" fill="#f4f6f8"/>
  <text x="40" y="764" font-size="12" font-weight="700" fill="#1f2933">Правила схемы</text>
  <text x="40" y="786" font-size="12" fill="#374151">1. Писатель агрегата заявки — только «Приложение РемКонтур». Воркер изменяет только служебные поля outbox.</text>
  <text x="40" y="806" font-size="12" fill="#374151">2. Цикла нет: АРМ → приложение → БД; воркер → БД и → уведомления. Уведомления не вызывают приложение.</text>
  <text x="40" y="826" font-size="12" fill="#374151">3. Офлайн NFR-02 покрыт на АРМ через IndexedDB и локальную очередь создания заявок.</text>
  <text x="40" y="854" font-size="12" fill="#5f6b7a">Версия 0.1 · 2026-10-28 · ADR-001, ADR-002, ADR-003</text>
</svg>
