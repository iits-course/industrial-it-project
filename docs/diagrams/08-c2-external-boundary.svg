<rect width="1640" height="900" fill="#ffffff"/>
<text x="24" y="32" font-size="19" font-weight="700" fill="#1f2933">C2 v0.2 · внешняя граница РемКонтур (неделя 8, Тема 2.4)</text>
<text x="24" y="53" font-size="12" fill="#5f6b7a">Адаптеры на стыках с legacy и вендором; мимо адаптера нет ни одной стрелки, кроме двух исключений по ADR-006 (SSO по OIDC и Workforce по контракту). Учебная гипотеза v0.2: заменяет прямые стрелки C2 v0.1 (05 §6).</text>
