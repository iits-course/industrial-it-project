<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>SRE dashboard sketch for RemKontur</title>
<desc>Panel layout for SLO burn, API RED metrics, journey funnel, dependency health, outbox and consumer lag, business throughput and change annotations.</desc>
<rect width="1400" height="860" fill="#ffffff"/>
