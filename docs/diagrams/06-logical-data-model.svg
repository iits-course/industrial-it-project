<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Логическая модель данных системы управления заявками</title>
  <desc id="desc">Восемь сущностей: подразделение, оборудование, сотрудник, заявка, назначение, результат работ, история и outbox с кардинальностями.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#607890"/></marker>
    <style>
      .bg{fill:#f6f8fb}.entity{fill:#fff;stroke:#7891a8;stroke-width:2;rx:12}.master{fill:#eef7ff;stroke:#3f83c4}.core{fill:#eef9f3;stroke:#3f956d}.tech{fill:#f4f0ff;stroke:#7863be}.title{font:700 26px Arial,sans-serif;fill:#10233d}.h{font:700 16px Arial,sans-serif;fill:#16324c}.pk{font:700 12px monospace;fill:#1f5b93}.f{font:12px monospace;fill:#425e75}.rel{stroke:#607890;stroke-width:2;fill:none}.card{font:700 12px Arial,sans-serif;fill:#405a71}.legend{font:12px Arial,sans-serif;fill:#526a80}
    </style>
  </defs>
  <rect width="1600" height="930" class="bg"/>
  <text x="50" y="48" class="title">Логическая модель · 8 ключевых сущностей и SoR-границы</text>

  <rect x="60" y="110" width="270" height="150" class="entity master"/>
  <text x="82" y="140" class="h">OrgUnit · HR SoR</text><text x="82" y="170" class="pk">PK org_unit_id</text><text x="82" y="195" class="f">code · name · type</text><text x="82" y="220" class="f">status · valid_from/to</text>
  <rect x="60" y="335" width="270" height="170" class="entity master"/>
  <text x="82" y="365" class="h">Equipment · EAM SoR</text><text x="82" y="395" class="pk">PK equipment_id</text><text x="82" y="420" class="f">FK org_unit_id</text><text x="82" y="445" class="f">inventory_no · model</text><text x="82" y="470" class="f">status · criticality</text>
  <rect x="60" y="585" width="270" height="170" class="entity master"/>
  <text x="82" y="615" class="h">Employee · HR/IAM SoR</text><text x="82" y="645" class="pk">PK employee_id</text><text x="82" y="670" class="f">FK org_unit_id</text><text x="82" y="695" class="f">role · specialty</text><text x="82" y="720" class="f">status</text>

  <rect x="485" y="295" width="330" height="255" class="entity core"/>
  <text x="510" y="328" class="h">RepairRequest · Request SoR</text><text x="510" y="360" class="pk">PK request_id</text><text x="510" y="385" class="f">FK equipment_id · org_unit_id</text><text x="510" y="410" class="f">FK created_by_employee_id</text><text x="510" y="435" class="f">category · priority · status</text><text x="510" y="460" class="f">detected_at · created_at</text><text x="510" y="485" class="f">description · version</text><text x="510" y="520" class="card">агрегат lifecycle</text>

  <rect x="980" y="95" width="300" height="180" class="entity core"/>
  <text x="1004" y="126" class="h">Assignment</text><text x="1004" y="157" class="pk">PK assignment_id</text><text x="1004" y="182" class="f">FK request_id · employee_id</text><text x="1004" y="207" class="f">state · saga_id</text><text x="1004" y="232" class="f">reserved/assigned/cancelled_at</text>
  <rect x="980" y="330" width="300" height="180" class="entity core"/>
  <text x="1004" y="361" class="h">WorkResult</text><text x="1004" y="392" class="pk">PK work_result_id</text><text x="1004" y="417" class="f">FK request_id · engineer_id</text><text x="1004" y="442" class="f">diagnosis · repair_result</text><text x="1004" y="467" class="f">completed_at</text>
  <rect x="980" y="565" width="300" height="180" class="entity core"/>
  <text x="1004" y="596" class="h">RequestHistory · append-only</text><text x="1004" y="627" class="pk">PK history_id</text><text x="1004" y="652" class="f">FK request_id · actor_id</text><text x="1004" y="677" class="f">action · old/new value</text><text x="1004" y="702" class="f">occurred_at · correlation_id</text>
  <rect x="980" y="790" width="300" height="110" class="entity tech"/>
  <text x="1004" y="821" class="h">OutboxEvent</text><text x="1004" y="852" class="pk">PK event_id</text><text x="1004" y="877" class="f">aggregate/version · payload</text>

  <path d="M330 185 H405 V345 H485" class="rel"/><text x="354" y="173" class="card">1</text><text x="452" y="334" class="card">0..*</text>
  <path d="M330 420 H485" class="rel"/><text x="349" y="408" class="card">1</text><text x="452" y="408" class="card">0..*</text>
  <path d="M330 670 H405 V475 H485" class="rel"/><text x="350" y="658" class="card">1</text><text x="452" y="465" class="card">0..*</text>
  <path d="M815 350 H895 V185 H980" class="rel"/><text x="832" y="339" class="card">1</text><text x="941" y="174" class="card">0..*</text>
  <path d="M815 420 H980" class="rel"/><text x="832" y="408" class="card">1</text><text x="942" y="408" class="card">0..1</text>
  <path d="M815 475 H895 V655 H980" class="rel"/><text x="832" y="464" class="card">1</text><text x="941" y="644" class="card">1..*</text>
  <path d="M650 550 V845 H980" class="rel"/><text x="663" y="578" class="card">1</text><text x="942" y="834" class="card">0..*</text>
  <path d="M330 670 H860 V215 H980" class="rel"/>
  <path d="M330 695 H880 V420 H980" class="rel"/>

  <text x="50" y="895" class="legend">Голубой — внешние master data · зелёный — транзакции контекста заявок · фиолетовый — технический Outbox</text>
</svg>
