<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Incident lifecycle for RemKontur</title>
<desc>Five-stage incident lifecycle with entry and exit criteria, the feedback loop into detection and runbooks, and the four incident roles.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/>
</marker>
<marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a00"/>
</marker>
</defs>
<rect width="1400" height="620" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#1f2933">Incident lifecycle — RemKontur (week 12)</text>
<text x="24" y="55" font-size="12" fill="#5f6b7a">Five stages, one feedback loop. Every stage change, severity change and owner change is written into the timeline with a UTC timestamp. Design hypothesis, not an exercised process.</text>

<!-- Stage 1 -->
<g>
<rect x="40" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="62" cy="114" r="13" fill="#1f2933"/>
<text x="62" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82" y="119" font-size="15" font-weight="700" fill="#1f2933">Detect</text>
<text x="56" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ENTRY</text>
<text x="56" y="162" font-size="10" fill="#3e4c59">Symptom alert, user call or</text>
<text x="56" y="176" font-size="10" fill="#3e4c59">failed synthetic check</text>
<text x="56" y="200" font-size="9.5" font-weight="700" fill="#8a94a6">ACTIONS</text>
<text x="56" y="216" font-size="10" fill="#3e4c59">Validate the signal; open the</text>
<text x="56" y="230" font-size="10" fill="#3e4c59">channel; start the timeline;</text>
<text x="56" y="244" font-size="10" fill="#3e4c59">assign a scribe</text>
<text x="56" y="268" font-size="9.5" font-weight="700" fill="#8a94a6">EXIT</text>
<text x="56" y="284" font-size="10" fill="#3e4c59">Real user impact confirmed,</text>
<text x="56" y="298" font-size="10" fill="#3e4c59">not a monitoring artefact</text>
</g>
<line x1="280" y1="210" x2="305" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 2 -->
<g>
<rect x="311" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="333" cy="114" r="13" fill="#1f2933"/>
<text x="333" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="353" y="119" font-size="15" font-weight="700" fill="#1f2933">Respond</text>
<text x="327" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ENTRY</text>
<text x="327" y="162" font-size="10" fill="#3e4c59">Impact confirmed</text>
<text x="327" y="200" font-size="9.5" font-weight="700" fill="#8a94a6">ACTIONS</text>
<text x="327" y="216" font-size="10" fill="#3e4c59">Set severity; name the IC;</text>
<text x="327" y="230" font-size="10" fill="#3e4c59">list affected journeys; send</text>
<text x="327" y="244" font-size="10" fill="#3e4c59">the first update; freeze</text>
<text x="327" y="258" font-size="10" fill="#3e4c59">risky changes</text>
<text x="327" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">EXIT</text>
<text x="327" y="298" font-size="10" fill="#3e4c59">Roles assigned, update sent</text>
</g>
<line x1="551" y1="210" x2="576" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 3 -->
<g>
<rect x="582" y="90" width="236" height="240" rx="9" fill="#fffaf2" stroke="#e0b877" stroke-width="1.5"/>
<circle cx="604" cy="114" r="13" fill="#b26a00"/>
<text x="604" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="624" y="119" font-size="15" font-weight="700" fill="#1f2933">Mitigate</text>
<text x="598" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ENTRY</text>
<text x="598" y="162" font-size="10" fill="#3e4c59">Roles assigned</text>
<text x="598" y="200" font-size="9.5" font-weight="700" fill="#8a94a6">ACTIONS</text>
<text x="598" y="216" font-size="10" fill="#3e4c59">Roll back, switch a flag,</text>
<text x="598" y="230" font-size="10" fill="#3e4c59">fail over, degrade, drain or</text>
<text x="598" y="244" font-size="10" fill="#3e4c59">isolate. Fastest reversible</text>
<text x="598" y="258" font-size="10" fill="#3e4c59">action first</text>
<text x="598" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">EXIT</text>
<text x="598" y="298" font-size="10" fill="#3e4c59">Journey restored, or declared</text>
<text x="598" y="312" font-size="10" fill="#3e4c59">degradation visible to users</text>
</g>
<line x1="822" y1="210" x2="847" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 4 -->
<g>
<rect x="853" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="875" cy="114" r="13" fill="#1f2933"/>
<text x="875" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="895" y="119" font-size="15" font-weight="700" fill="#1f2933">Resolve</text>
<text x="869" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ENTRY</text>
<text x="869" y="162" font-size="10" fill="#3e4c59">Mitigation works</text>
<text x="869" y="200" font-size="9.5" font-weight="700" fill="#8a94a6">ACTIONS</text>
<text x="869" y="216" font-size="10" fill="#3e4c59">Confirm burn below 1×; drain</text>
<text x="869" y="230" font-size="10" fill="#3e4c59">backlogs; reconcile dupli-</text>
<text x="869" y="244" font-size="10" fill="#3e4c59">cates; watch a stability</text>
<text x="869" y="258" font-size="10" fill="#3e4c59">window</text>
<text x="869" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">EXIT</text>
<text x="869" y="298" font-size="10" fill="#3e4c59">Metrics stable for 30 min</text>
</g>
<line x1="1093" y1="210" x2="1118" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 5 -->
<g>
<rect x="1124" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="1146" cy="114" r="13" fill="#1f2933"/>
<text x="1146" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="1166" y="119" font-size="15" font-weight="700" fill="#1f2933">Review</text>
<text x="1140" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ENTRY</text>
<text x="1140" y="162" font-size="10" fill="#3e4c59">SEV-1/2 resolved or any</text>
<text x="1140" y="176" font-size="10" fill="#3e4c59">guardrail incident</text>
<text x="1140" y="200" font-size="9.5" font-weight="700" fill="#8a94a6">ACTIONS</text>
<text x="1140" y="216" font-size="10" fill="#3e4c59">Blameless review within five</text>
<text x="1140" y="230" font-size="10" fill="#3e4c59">business days; actions with</text>
<text x="1140" y="244" font-size="10" fill="#3e4c59">owner and date; publish</text>
<text x="1140" y="268" font-size="9.5" font-weight="700" fill="#8a94a6">EXIT</text>
<text x="1140" y="284" font-size="10" fill="#3e4c59">Actions in backlog; review</text>
<text x="1140" y="298" font-size="10" fill="#3e4c59">published</text>
</g>

<!-- Feedback loop -->
<path d="M 1242 334 L 1242 372 L 158 372 L 158 336" fill="none" stroke="#b26a00" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#loop)"/>
<rect x="520" y="356" width="360" height="32" rx="6" fill="#fffaf2" stroke="#e0b877" stroke-width="1"/>
<text x="700" y="377" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">Every review changes detection, a runbook or the architecture</text>

<!-- Roles -->
<text x="40" y="432" font-size="13" font-weight="700" fill="#1f2933">Roles</text>
<text x="92" y="432" font-size="11" fill="#5f6b7a">One person may hold two roles in a small team; the incident commander and the technical lead must differ as soon as the team size allows.</text>

<g>
<rect x="40" y="448" width="316" height="72" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="56" y="470" font-size="12" font-weight="700" fill="#1f2933">Incident commander</text>
<text x="56" y="488" font-size="10" fill="#3e4c59">Declares severity, owns decisions and the timeline,</text>
<text x="56" y="503" font-size="10" fill="#3e4c59">approves rollback. <tspan font-weight="700" fill="#b26a00">Does not fix the system.</tspan></text>
</g>
<g>
<rect x="372" y="448" width="316" height="72" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="388" y="470" font-size="12" font-weight="700" fill="#1f2933">Technical lead</text>
<text x="388" y="488" font-size="10" fill="#3e4c59">Diagnoses, directs engineers, executes or supervises</text>
<text x="388" y="503" font-size="10" fill="#3e4c59">the mitigation; reports the technical state to the IC.</text>
</g>
<g>
<rect x="704" y="448" width="316" height="72" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="720" y="470" font-size="12" font-weight="700" fill="#1f2933">Communications lead</text>
<text x="720" y="488" font-size="10" fill="#3e4c59">Publishes on schedule; translates technical state into</text>
<text x="720" y="503" font-size="10" fill="#3e4c59">business impact; owns the single external channel.</text>
</g>
<g>
<rect x="1036" y="448" width="324" height="72" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="1052" y="470" font-size="12" font-weight="700" fill="#1f2933">Scribe</text>
<text x="1052" y="488" font-size="10" fill="#3e4c59">Records UTC timestamps, decisions, actions and</text>
<text x="1052" y="503" font-size="10" fill="#3e4c59">evidence links in real time. Does not debug.</text>
</g>

<text x="40" y="556" font-size="10.5" fill="#5f6b7a">Cadence: SEV-1 every 30 min with a 5-minute acknowledgement; SEV-2 hourly with a 15-minute acknowledgement; SEV-3 when the state changes; SEV-4 as a ticket.</text>
<text x="40" y="574" font-size="10.5" fill="#5f6b7a">The lifecycle is not a waterfall: mitigation may start before severity is formally assigned, and a failed mitigation returns the incident to stage 3.</text>
<text x="40" y="592" font-size="10.5" fill="#5f6b7a">Source: docs/runbooks/12-incident-management.md §3–5. Design hypothesis; no incident has been managed under this regulation.</text>
</svg>
