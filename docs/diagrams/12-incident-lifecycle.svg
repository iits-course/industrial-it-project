<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Жизненный цикл инцидента для РемКонтур</title>
<desc>Пятистадийный жизненный цикл инцидента с условиями входа и выхода, петлёй обратной связи в обнаружение и runbook’и, а также четырьмя ролями.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/>
</marker>
<marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a00"/>
</marker>
</defs>
<rect width="1400" height="640" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#1f2933">Жизненный цикл инцидента — РемКонтур (неделя 12)</text>
<text x="24" y="55" font-size="12" fill="#5f6b7a">Пять стадий, одна петля обратной связи. Каждая смена стадии, уровня серьёзности и владельца записывается в хронологию с меткой UTC. Проектная гипотеза, процесс не отрабатывался.</text>

<!-- Stage 1 -->
<g>
<rect x="40" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="62" cy="114" r="13" fill="#1f2933"/>
<text x="62" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82" y="119" font-size="14" font-weight="700" fill="#1f2933">Обнаружение</text>
<text x="56" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ВХОД</text>
<text x="56" y="162" font-size="10" fill="#3e4c59">Алерт по симптому, звонок</text>
<text x="56" y="176" font-size="10" fill="#3e4c59">пользователя или сбой</text>
<text x="56" y="190" font-size="10" fill="#3e4c59">синтетической проверки</text>
<text x="56" y="212" font-size="9.5" font-weight="700" fill="#8a94a6">ДЕЙСТВИЯ</text>
<text x="56" y="228" font-size="10" fill="#3e4c59">Подтвердить сигнал; открыть</text>
<text x="56" y="242" font-size="10" fill="#3e4c59">канал; начать хронологию;</text>
<text x="56" y="256" font-size="10" fill="#3e4c59">назначить секретаря</text>
<text x="56" y="280" font-size="9.5" font-weight="700" fill="#8a94a6">ВЫХОД</text>
<text x="56" y="296" font-size="10" fill="#3e4c59">Подтверждено реальное</text>
<text x="56" y="310" font-size="10" fill="#3e4c59">влияние на пользователей</text>
</g>
<line x1="280" y1="210" x2="305" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 2 -->
<g>
<rect x="311" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="333" cy="114" r="13" fill="#1f2933"/>
<text x="333" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="353" y="119" font-size="14" font-weight="700" fill="#1f2933">Реакция</text>
<text x="327" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ВХОД</text>
<text x="327" y="162" font-size="10" fill="#3e4c59">Влияние подтверждено</text>
<text x="327" y="196" font-size="9.5" font-weight="700" fill="#8a94a6">ДЕЙСТВИЯ</text>
<text x="327" y="212" font-size="10" fill="#3e4c59">Назначить уровень; назвать IC;</text>
<text x="327" y="226" font-size="10" fill="#3e4c59">определить сценарии; отправить</text>
<text x="327" y="240" font-size="10" fill="#3e4c59">первое обновление; заморозить</text>
<text x="327" y="254" font-size="10" fill="#3e4c59">рискованные изменения</text>
<text x="327" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">ВЫХОД</text>
<text x="327" y="298" font-size="10" fill="#3e4c59">Роли назначены, обновление</text>
<text x="327" y="312" font-size="10" fill="#3e4c59">отправлено</text>
</g>
<line x1="551" y1="210" x2="576" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 3 -->
<g>
<rect x="582" y="90" width="236" height="240" rx="9" fill="#fffaf2" stroke="#e0b877" stroke-width="1.5"/>
<circle cx="604" cy="114" r="13" fill="#b26a00"/>
<text x="604" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="624" y="119" font-size="14" font-weight="700" fill="#1f2933">Локализация</text>
<text x="598" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ВХОД</text>
<text x="598" y="162" font-size="10" fill="#3e4c59">Роли назначены</text>
<text x="598" y="196" font-size="9.5" font-weight="700" fill="#8a94a6">ДЕЙСТВИЯ</text>
<text x="598" y="212" font-size="10" fill="#3e4c59">Откат, флаг, переключение,</text>
<text x="598" y="226" font-size="10" fill="#3e4c59">деградация, разгрузка или</text>
<text x="598" y="240" font-size="10" fill="#3e4c59">изоляция. Сначала самое</text>
<text x="598" y="254" font-size="10" fill="#3e4c59">быстрое обратимое действие</text>
<text x="598" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">ВЫХОД</text>
<text x="598" y="298" font-size="10" fill="#3e4c59">Сценарий восстановлен или</text>
<text x="598" y="312" font-size="10" fill="#3e4c59">деградация объявлена и видна</text>
</g>
<line x1="822" y1="210" x2="847" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 4 -->
<g>
<rect x="853" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="875" cy="114" r="13" fill="#1f2933"/>
<text x="875" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="895" y="119" font-size="14" font-weight="700" fill="#1f2933">Завершение</text>
<text x="869" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ВХОД</text>
<text x="869" y="162" font-size="10" fill="#3e4c59">Локализация сработала</text>
<text x="869" y="196" font-size="9.5" font-weight="700" fill="#8a94a6">ДЕЙСТВИЯ</text>
<text x="869" y="212" font-size="10" fill="#3e4c59">Подтвердить выгорание ниже 1×;</text>
<text x="869" y="226" font-size="10" fill="#3e4c59">разгрузить очереди;</text>
<text x="869" y="240" font-size="10" fill="#3e4c59">сверить дубли; наблюдать</text>
<text x="869" y="254" font-size="10" fill="#3e4c59">окно стабильности</text>
<text x="869" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">ВЫХОД</text>
<text x="869" y="298" font-size="10" fill="#3e4c59">Метрики стабильны 30 мин;</text>
<text x="869" y="312" font-size="10" fill="#3e4c59">нет необъяснённых дублей</text>
</g>
<line x1="1093" y1="210" x2="1118" y2="210" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Stage 5 -->
<g>
<rect x="1124" y="90" width="236" height="240" rx="9" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.3"/>
<circle cx="1146" cy="114" r="13" fill="#1f2933"/>
<text x="1146" y="119" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="1166" y="119" font-size="14" font-weight="700" fill="#1f2933">Разбор</text>
<text x="1140" y="146" font-size="9.5" font-weight="700" fill="#8a94a6">ВХОД</text>
<text x="1140" y="162" font-size="10" fill="#3e4c59">SEV-1/2 завершён или</text>
<text x="1140" y="176" font-size="10" fill="#3e4c59">любой guardrail-инцидент</text>
<text x="1140" y="200" font-size="9.5" font-weight="700" fill="#8a94a6">ДЕЙСТВИЯ</text>
<text x="1140" y="216" font-size="10" fill="#3e4c59">Разбор без обвинений за пять</text>
<text x="1140" y="230" font-size="10" fill="#3e4c59">рабочих дней; действия с</text>
<text x="1140" y="244" font-size="10" fill="#3e4c59">владельцем и сроком;</text>
<text x="1140" y="258" font-size="10" fill="#3e4c59">опубликовать</text>
<text x="1140" y="282" font-size="9.5" font-weight="700" fill="#8a94a6">ВЫХОД</text>
<text x="1140" y="298" font-size="10" fill="#3e4c59">Действия в бэклоге; разбор</text>
<text x="1140" y="312" font-size="10" fill="#3e4c59">опубликован</text>
</g>

<!-- Feedback loop -->
<path d="M 1242 334 L 1242 372 L 158 372 L 158 336" fill="none" stroke="#b26a00" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#loop)"/>
<rect x="500" y="356" width="400" height="32" rx="6" fill="#fffaf2" stroke="#e0b877" stroke-width="1"/>
<text x="700" y="377" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">Каждый разбор меняет обнаружение, runbook или архитектуру</text>

<!-- Roles -->
<text x="40" y="436" font-size="13" font-weight="700" fill="#1f2933">Роли</text>
<text x="92" y="436" font-size="11" fill="#5f6b7a">Один человек может совмещать две роли в маленькой команде; руководитель инцидента и технический лидер должны различаться, как только позволяет размер команды.</text>

<g>
<rect x="40" y="452" width="316" height="84" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="56" y="474" font-size="12" font-weight="700" fill="#1f2933">Руководитель инцидента</text>
<text x="56" y="492" font-size="10" fill="#3e4c59">Объявляет уровень, владеет решениями</text>
<text x="56" y="506" font-size="10" fill="#3e4c59">и хронологией, утверждает откат.</text>
<text x="56" y="520" font-size="10" font-weight="700" fill="#b26a00">Не чинит систему.</text>
</g>
<g>
<rect x="372" y="452" width="316" height="84" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="388" y="474" font-size="12" font-weight="700" fill="#1f2933">Технический лидер</text>
<text x="388" y="492" font-size="10" fill="#3e4c59">Диагностирует, направляет инженеров,</text>
<text x="388" y="506" font-size="10" fill="#3e4c59">выполняет или контролирует локализацию;</text>
<text x="388" y="520" font-size="10" fill="#3e4c59">докладывает IC техническое состояние.</text>
</g>
<g>
<rect x="704" y="452" width="316" height="84" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="720" y="474" font-size="12" font-weight="700" fill="#1f2933">Коммуникации</text>
<text x="720" y="492" font-size="10" fill="#3e4c59">Публикует по расписанию; переводит</text>
<text x="720" y="506" font-size="10" fill="#3e4c59">техническое состояние в бизнес-влияние;</text>
<text x="720" y="520" font-size="10" fill="#3e4c59">ведёт единый внешний канал.</text>
</g>
<g>
<rect x="1036" y="452" width="324" height="84" rx="8" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/>
<text x="1052" y="474" font-size="12" font-weight="700" fill="#1f2933">Секретарь</text>
<text x="1052" y="492" font-size="10" fill="#3e4c59">Записывает метки UTC, решения, действия</text>
<text x="1052" y="506" font-size="10" fill="#3e4c59">и ссылки на доказательства в реальном</text>
<text x="1052" y="520" font-size="10" fill="#3e4c59">времени. Не занимается отладкой.</text>
</g>

<text x="40" y="566" font-size="10.5" fill="#5f6b7a">Каденция: SEV-1 каждые 30 мин с подтверждением за 5 минут; SEV-2 ежечасно с подтверждением за 15 минут; SEV-3 при изменении состояния; SEV-4 — задача.</text>
<text x="40" y="584" font-size="10.5" fill="#5f6b7a">Жизненный цикл — не водопад: локализация может начаться до формального назначения серьёзности, а неудачная локализация возвращает инцидент на стадию 3.</text>
<text x="40" y="602" font-size="10.5" fill="#5f6b7a">Источник: docs/runbooks/12-incident-management.md §3–5. Проектная гипотеза; ни один инцидент не управлялся по этому регламенту.</text>
</svg>
