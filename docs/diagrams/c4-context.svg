<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>C1 System Context — РемКонтур v0.1</title>
  <defs>
    <marker id="c1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1280" height="820" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="700" fill="#1f2933">C1 · System Context — РемКонтур v0.1</text>
  <text x="24" y="48" font-size="12" fill="#5f6b7a">В центре одна система, без технологических деталей. Подписи на стрелках — действие инициатора.</text>

  <rect x="24" y="80" width="220" height="86" rx="8" fill="#084c61"/>
  <text x="134" y="106" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Оператор</text>
  <text x="134" y="126" font-size="11" fill="#d7eef3" text-anchor="middle">Создаёт заявку и смотрит статус</text>

  <rect x="24" y="186" width="220" height="86" rx="8" fill="#084c61"/>
  <text x="134" y="212" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Мастер смены</text>
  <text x="134" y="232" font-size="11" fill="#d7eef3" text-anchor="middle">Уточняет данные и приоритет</text>

  <rect x="24" y="292" width="220" height="86" rx="8" fill="#084c61"/>
  <text x="134" y="318" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Диспетчер</text>
  <text x="134" y="338" font-size="11" fill="#d7eef3" text-anchor="middle">Назначает исполнителя</text>

  <rect x="24" y="398" width="220" height="86" rx="8" fill="#084c61"/>
  <text x="134" y="424" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Инженер</text>
  <text x="134" y="444" font-size="11" fill="#d7eef3" text-anchor="middle">Фиксирует результат</text>

  <rect x="24" y="504" width="220" height="86" rx="8" fill="#084c61"/>
  <text x="134" y="530" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Руководитель</text>
  <text x="134" y="550" font-size="11" fill="#d7eef3" text-anchor="middle">Контролирует очередь и сроки</text>

  <rect x="430" y="250" width="300" height="150" rx="10" fill="#177e89" stroke="#0e4f56" stroke-width="3"/>
  <text x="580" y="292" font-size="11" fill="#d7eef3" text-anchor="middle">НАША СИСТЕМА</text>
  <text x="580" y="322" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">РемКонтур</text>
  <text x="580" y="348" font-size="12" fill="#d7eef3" text-anchor="middle">Регистрация, диспетчеризация, результат, история</text>
  <text x="580" y="366" font-size="12" fill="#d7eef3" text-anchor="middle">заявок на ремонт и ТО</text>

  <rect x="1036" y="80" width="220" height="86" rx="8" fill="#6b7280"/>
  <text x="1146" y="106" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Корпоративный SSO</text>
  <text x="1146" y="126" font-size="11" fill="#e5e7eb" text-anchor="middle">Аутентификация</text>

  <rect x="1036" y="186" width="220" height="86" rx="8" fill="#6b7280"/>
  <text x="1146" y="212" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Справочник сотрудников</text>
  <text x="1146" y="232" font-size="11" fill="#e5e7eb" text-anchor="middle">Люди, участки, роли</text>

  <rect x="1036" y="292" width="220" height="86" rx="8" fill="#6b7280"/>
  <text x="1146" y="318" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Учёт оборудования</text>
  <text x="1146" y="338" font-size="11" fill="#e5e7eb" text-anchor="middle">Карточки единиц</text>

  <rect x="1036" y="398" width="220" height="86" rx="8" fill="#6b7280"/>
  <text x="1146" y="424" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Сервис уведомлений</text>
  <text x="1146" y="444" font-size="11" fill="#e5e7eb" text-anchor="middle">Сообщения о событиях заявки</text>

