  <line x1="244" y1="229" x2="430" y2="310" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="244" y1="335" x2="430" y2="325" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="244" y1="441" x2="430" y2="350" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="244" y1="547" x2="430" y2="380" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>

  <line x1="730" y1="280" x2="1036" y2="123" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="730" y1="310" x2="1036" y2="229" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="730" y1="340" x2="1036" y2="335" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="730" y1="380" x2="1036" y2="430" stroke="#4b5563" stroke-width="1.4" marker-end="url(#c1-arr)"/>
  <line x1="1146" y1="484" x2="244" y2="590" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#c1-arr)"/>

  <text x="330" y="250" font-size="10" fill="#374151">Используют систему</text>
  <text x="820" y="200" font-size="10" fill="#374151">Проверяет сессию</text>
  <text x="820" y="250" font-size="10" fill="#374151">Читает сотрудников</text>
  <text x="790" y="318" font-size="10" fill="#374151">Читает оборудование</text>
  <text x="790" y="410" font-size="10" fill="#374151">Передаёт события заявки</text>
  <text x="560" y="640" font-size="10" fill="#6b7280">Уведомления доставляются пользователям вне транзакции заявки</text>

  <rect x="24" y="700" width="1232" height="96" rx="8" fill="#f4f6f8"/>
  <text x="40" y="724" font-size="12" font-weight="700" fill="#1f2933">Легенда</text>
  <rect x="40" y="740" width="22" height="14" rx="3" fill="#084c61"/>
  <text x="70" y="752" font-size="12" fill="#1f2933">Person</text>
  <rect x="430" y="740" width="22" height="14" rx="3" fill="#177e89"/>
  <text x="460" y="752" font-size="12" fill="#1f2933">Software System (наша граница)</text>
  <rect x="780" y="740" width="22" height="14" rx="3" fill="#6b7280"/>
  <text x="810" y="752" font-size="12" fill="#1f2933">Внешняя система</text>
  <text x="40" y="778" font-size="12" fill="#5f6b7a">Версия 0.1 · 2026-10-28</text>
