<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 920" width="1680" height="920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Event Storming — обычная незапланированная заявка</title>
  <rect width="1680" height="920" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1f2933">Event Storming v0.1 · обычная незапланированная заявка на ремонт</text>
  <text x="20" y="48" font-size="12" fill="#5f6b7a">Оранжевый — доменное событие. Синий — команда. Жёлтый — агрегат. Розовый — политика. Красная рамка — риск или точка отказа.</text>

  <rect x="20" y="70" width="400" height="28" rx="4" fill="#eceff1"/>
  <text x="220" y="89" font-size="12" font-weight="700" fill="#37474f" text-anchor="middle">1. Регистрация (W-01, W-02)</text>
  <rect x="430" y="70" width="400" height="28" rx="4" fill="#eceff1"/>
  <text x="630" y="89" font-size="12" font-weight="700" fill="#37474f" text-anchor="middle">2. Диспетчеризация (W-03)</text>
  <rect x="840" y="70" width="400" height="28" rx="4" fill="#eceff1"/>
  <text x="1040" y="89" font-size="12" font-weight="700" fill="#37474f" text-anchor="middle">3. Исполнение и закрытие (W-05)</text>
  <rect x="1250" y="70" width="410" height="28" rx="4" fill="#eceff1"/>
  <text x="1455" y="89" font-size="12" font-weight="700" fill="#37474f" text-anchor="middle">4. Побочные эффекты и защита</text>

  <text x="20" y="128" font-size="11" font-weight="700" fill="#1565c0">Команды</text>
  <rect x="20" y="140" width="180" height="56" rx="4" fill="#bbdefb"/>
  <text x="110" y="164" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">Зарегистрировать</text>
  <text x="110" y="180" font-size="11" fill="#0d47a1" text-anchor="middle">заявку</text>
  <rect x="430" y="140" width="180" height="56" rx="4" fill="#bbdefb"/>
  <text x="520" y="164" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">Утвердить приоритет</text>
  <text x="520" y="180" font-size="11" fill="#0d47a1" text-anchor="middle">Назначить исполнителя</text>
  <rect x="840" y="140" width="180" height="56" rx="4" fill="#bbdefb"/>
  <text x="930" y="164" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">Начать работы</text>
  <text x="930" y="180" font-size="11" fill="#0d47a1" text-anchor="middle">Сохранить результат</text>
  <rect x="1040" y="140" width="180" height="56" rx="4" fill="#bbdefb"/>
  <text x="1130" y="172" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">Закрыть заявку</text>
  <rect x="1250" y="140" width="180" height="56" rx="4" fill="#bbdefb"/>
  <text x="1340" y="164" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">Повторить доставку</text>
  <text x="1340" y="180" font-size="11" fill="#0d47a1" text-anchor="middle">уведомления</text>

  <text x="20" y="228" font-size="11" font-weight="700" fill="#e65100">События</text>
  <rect x="20" y="240" width="170" height="70" rx="4" fill="#ffe0b2"/>
  <text x="105" y="268" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Неисправность</text>
  <text x="105" y="284" font-size="11" fill="#bf360c" text-anchor="middle">обнаружена</text>
  <rect x="210" y="240" width="190" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="305" y="260" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Операция поставлена</text>
  <text x="305" y="276" font-size="11" fill="#bf360c" text-anchor="middle">в локальную очередь</text>
  <text x="305" y="294" font-size="10" fill="#c62828" text-anchor="middle">FP-08 · NFR-02</text>
  <rect x="20" y="330" width="190" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="115" y="354" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Возможный дубль</text>
  <text x="115" y="370" font-size="11" fill="#bf360c" text-anchor="middle">показан</text>
  <text x="115" y="388" font-size="10" fill="#c62828" text-anchor="middle">FP-03 · FR-02</text>
  <rect x="230" y="330" width="190" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="325" y="354" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Заявка зарегистрирована</text>
  <text x="325" y="370" font-size="11" fill="#bf360c" text-anchor="middle">ID и время выданы сервером</text>
  <text x="325" y="388" font-size="10" fill="#c62828" text-anchor="middle">FP-01 · FR-01</text>

  <rect x="430" y="240" width="180" height="70" rx="4" fill="#ffe0b2"/>
  <text x="520" y="268" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Заявка попала</text>
  <text x="520" y="284" font-size="11" fill="#bf360c" text-anchor="middle">в очередь диспетчера</text>
  <rect x="630" y="240" width="180" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="720" y="260" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Приоритет утверждён</text>
  <text x="720" y="276" font-size="11" fill="#bf360c" text-anchor="middle">окончательное значение</text>
  <text x="720" y="294" font-size="10" fill="#c62828" text-anchor="middle">FP-04 · FR-06</text>
  <rect x="430" y="330" width="180" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="520" y="354" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Исполнитель назначен</text>
  <text x="520" y="370" font-size="11" fill="#bf360c" text-anchor="middle">автор и время в истории</text>
  <text x="520" y="388" font-size="10" fill="#c62828" text-anchor="middle">FP-04 · FR-04</text>
  <rect x="630" y="330" width="180" height="70" rx="4" fill="#ffe0b2"/>
  <text x="720" y="354" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Назначение отклонено</text>
  <text x="720" y="370" font-size="11" fill="#bf360c" text-anchor="middle">нет прав или нет людей</text>
  <text x="720" y="388" font-size="10" fill="#c62828" text-anchor="middle">NFR-04</text>

  <rect x="840" y="240" width="180" height="70" rx="4" fill="#ffe0b2"/>
  <text x="930" y="268" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Работы начаты</text>
  <text x="930" y="284" font-size="11" fill="#bf360c" text-anchor="middle">статус «В работе»</text>
  <rect x="1040" y="240" width="180" height="70" rx="4" fill="#ffe0b2"/>
  <text x="1130" y="260" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Диагностика</text>
  <text x="1130" y="276" font-size="11" fill="#bf360c" text-anchor="middle">зафиксирована</text>
  <text x="1130" y="294" font-size="10" fill="#c62828" text-anchor="middle">FR-07</text>
  <rect x="840" y="330" width="180" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="930" y="354" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Результат ремонта</text>
  <text x="930" y="370" font-size="11" fill="#bf360c" text-anchor="middle">зафиксирован</text>
  <text x="930" y="388" font-size="10" fill="#c62828" text-anchor="middle">FP-06 · FR-07</text>
  <rect x="1040" y="330" width="180" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="1130" y="350" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Заявка выполнена</text>
  <text x="1130" y="366" font-size="11" fill="#bf360c" text-anchor="middle">и закрыта</text>
  <text x="1130" y="384" font-size="10" fill="#c62828" text-anchor="middle">FR-05</text>

  <rect x="1250" y="240" width="190" height="70" rx="4" fill="#ffe0b2"/>
  <text x="1345" y="268" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Уведомление отправлено</text>
  <text x="1345" y="284" font-size="11" fill="#bf360c" text-anchor="middle">или поставлено в outbox</text>
  <rect x="1460" y="240" width="190" height="70" rx="4" fill="#ffe0b2" stroke="#c62828" stroke-width="2"/>
  <text x="1555" y="260" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Попытка вне полномочий</text>
  <text x="1555" y="276" font-size="11" fill="#bf360c" text-anchor="middle">отклонена и записана</text>
  <text x="1555" y="294" font-size="10" fill="#c62828" text-anchor="middle">FP-07 · NFR-04</text>
  <rect x="1250" y="330" width="190" height="70" rx="4" fill="#ffe0b2"/>
  <text x="1345" y="354" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">Доставка уведомления</text>
  <text x="1345" y="370" font-size="11" fill="#bf360c" text-anchor="middle">не подтверждена</text>
  <text x="1345" y="388" font-size="10" fill="#6d4c41" text-anchor="middle">заявка уже существует</text>

  <text x="20" y="440" font-size="11" font-weight="700" fill="#f9a825">Агрегаты</text>
  <rect x="20" y="452" width="200" height="58" rx="4" fill="#fff59d"/>
  <text x="120" y="478" font-size="12" font-weight="700" fill="#f57f17" text-anchor="middle">Операция синхронизации</text>
  <text x="120" y="496" font-size="11" fill="#795548" text-anchor="middle">АРМ + operationId</text>
  <rect x="240" y="452" width="180" height="58" rx="4" fill="#fff59d"/>
  <text x="330" y="478" font-size="12" font-weight="700" fill="#f57f17" text-anchor="middle">Заявка</text>
  <text x="330" y="496" font-size="11" fill="#795548" text-anchor="middle">система записи</text>
  <rect x="460" y="452" width="180" height="58" rx="4" fill="#fff59d"/>
  <text x="550" y="478" font-size="12" font-weight="700" fill="#f57f17" text-anchor="middle">Очередь диспетчера</text>
  <text x="550" y="496" font-size="11" fill="#795548" text-anchor="middle">политика назначения</text>
  <rect x="880" y="452" width="160" height="58" rx="4" fill="#fff59d"/>
  <text x="960" y="478" font-size="12" font-weight="700" fill="#f57f17" text-anchor="middle">Заявка</text>
  <text x="960" y="496" font-size="11" fill="#795548" text-anchor="middle">тот же агрегат</text>
  <rect x="1250" y="452" width="200" height="58" rx="4" fill="#fff59d"/>
  <text x="1350" y="478" font-size="12" font-weight="700" fill="#f57f17" text-anchor="middle">Исходящее сообщение</text>
  <text x="1350" y="496" font-size="11" fill="#795548" text-anchor="middle">outbox</text>
  <rect x="1470" y="452" width="180" height="58" rx="4" fill="#fff59d"/>
  <text x="1560" y="478" font-size="12" font-weight="700" fill="#f57f17" text-anchor="middle">Сессия и полномочия</text>
  <text x="1560" y="496" font-size="11" fill="#795548" text-anchor="middle">доступ и аудит</text>

  <text x="20" y="548" font-size="11" font-weight="700" fill="#ad1457">Политики</text>
  <rect x="20" y="560" width="400" height="50" rx="4" fill="#f8bbd0"/>
  <text x="220" y="590" font-size="12" fill="#880e4f" text-anchor="middle">После регистрации: очередь диспетчера и запись в outbox</text>
  <rect x="430" y="560" width="400" height="50" rx="4" fill="#f8bbd0"/>
  <text x="630" y="590" font-size="12" fill="#880e4f" text-anchor="middle">После назначения: уведомить инженера, сохранить историю</text>
  <rect x="840" y="560" width="400" height="50" rx="4" fill="#f8bbd0"/>
  <text x="1040" y="590" font-size="12" fill="#880e4f" text-anchor="middle">Закрытие без результата запрещено (FR-05)</text>
  <rect x="1250" y="560" width="400" height="50" rx="4" fill="#f8bbd0"/>
  <text x="1450" y="590" font-size="12" fill="#880e4f" text-anchor="middle">Отказ в праве: аудит обязателен, заявка не меняется (NFR-04)</text>

  <text x="20" y="648" font-size="11" font-weight="700" fill="#1f2933">Кандидаты в контексты</text>
  <rect x="20" y="662" width="400" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="220" y="690" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">Управление заявками · CORE</text>
  <text x="220" y="710" font-size="11" fill="#33691e" text-anchor="middle">регистрация, история, результат, закрытие, офлайн-очередь</text>
  <rect x="430" y="662" width="400" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="630" y="690" font-size="13" font-weight="700" fill="#0d47a1" text-anchor="middle">Диспетчеризация · SUPPORTING</text>
  <text x="630" y="710" font-size="11" fill="#1565c0" text-anchor="middle">очередь, приоритет, назначение</text>
  <rect x="840" y="662" width="400" height="70" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="1040" y="690" font-size="13" font-weight="700" fill="#e65100" text-anchor="middle">Исполнение в рамках CORE</text>
  <text x="1040" y="710" font-size="11" fill="#ef6c00" text-anchor="middle">инвариант закрытия не выносится в отдельный сервис</text>
  <rect x="1250" y="662" width="195" height="70" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="1348" y="690" font-size="12" font-weight="700" fill="#4a148c" text-anchor="middle">Уведомления</text>
  <text x="1348" y="710" font-size="11" fill="#6a1b9a" text-anchor="middle">GENERIC</text>
  <rect x="1455" y="662" width="195" height="70" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="1552" y="690" font-size="12" font-weight="700" fill="#4a148c" text-anchor="middle">Доступ и аудит</text>
  <text x="1552" y="710" font-size="11" fill="#6a1b9a" text-anchor="middle">GENERIC</text>

  <text x="20" y="770" font-size="12" fill="#5f6b7a">Справочник оборудования почти не виден на таймлайне: это чтение MDM при команде «Зарегистрировать заявку».</text>
  <text x="20" y="798" font-size="12" fill="#5f6b7a">Значение терминов меняется на границах: «приоритет» оператора и диспетчера различается, «выполнена» и «закрыта» — разные состояния.</text>
  <text x="20" y="834" font-size="12" fill="#5f6b7a">Версия 0.1 · 2026-10-28</text>
</svg>
