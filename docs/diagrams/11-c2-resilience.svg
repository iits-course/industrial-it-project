</defs>
<rect width="1680" height="1100" fill="#ffffff"/>
<text x="24" y="32" font-size="19" font-weight="700" fill="#1f2933">C2 v0.3 · resilience view — RemKontur (week 11, Topic 3.3)</text>
<text x="24" y="54" font-size="12" fill="#5f6b7a">Resilience annotations on the week-8 external boundary. Codes: TO timeout · RT retry with the same key · CB circuit breaker · RL rate limit · BH bulkhead · LS load shedding · DLQ dead-letter queue · HA high availability · DR disaster recovery.</text>
<text x="24" y="72" font-size="11" fill="#8a5a00">Design artefact: the patterns are specified, not yet configured in a running system. Edge numbers correspond to the tables in the SRE specification §6.3.</text>

