<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1100" width="1680" height="1100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>C2 v0.3 · resilience view of RemKontur</title>
<desc>Container view with timeouts, retries, circuit breakers, rate limits, bulkheads, dead-letter queues, high availability and disaster recovery annotations.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00838f"/></marker>
