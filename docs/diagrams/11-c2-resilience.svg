<rect width="1680" height="1100" fill="#ffffff"/>
<text x="24" y="32" font-size="19" font-weight="700" fill="#1f2933">C2 v0.3 · устойчивость РемКонтура (неделя 11, тема 3.3)</text>
<text x="24" y="54" font-size="12" fill="#5f6b7a">Дополнение к C2 недели 8. TO — таймаут · RT — повтор с тем же ключом · CB — размыкание · RL — лимит частоты · BH — изоляция · LS — сброс нагрузки · DLQ — очередь неразобранных · HA — высокая доступность · DR — восстановление.</text>
<text x="24" y="72" font-size="11" fill="#8a5a00">Механизмы спроектированы. Номера связей соответствуют §6.3 спецификации SRE.</text>

